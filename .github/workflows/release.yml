# LiteNote Release — tag 推送时触发：构建 + 发布到 GitHub Release
name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build and Release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build Tauri
        run: npm run tauri build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: LiteNote ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/litenote.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate updater manifest
        shell: bash
        run: |
          MSI=$(ls src-tauri/target/release/bundle/msi/*.msi | head -1)
          NSIS=$(ls src-tauri/target/release/bundle/nsis/*.exe | head -1)
          cat > latest.json << EOF
          {
            "version": "${{ github.ref_name }}",
            "notes": "See release notes at https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}",
            "pub_date": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "platforms": {
              "windows-x86_64": {
                "signature": "",
                "url": "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$(basename "$NSIS")"
              }
            }
          }
          EOF
          echo "Generated latest.json"

      - name: Upload updater manifest
        uses: softprops/action-gh-release@v2
        with:
          name: LiteNote ${{ github.ref_name }}
          draft: true
          files: latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
